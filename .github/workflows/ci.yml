name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this change need the Rust steps
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE...$HEAD" | grep -qvE '^(documentation/|data/research/|analysis/|[^/]+\.md$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'ubuntu-latest' && 'wasm32-unknown-unknown' || '' }}
      - if: steps.scope.outputs.rust == 'true'
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r analysis/requirements.txt
      - run: python analysis/validate_facts.py
      - run: python -m unittest discover -s analysis/tests
      - run: python analysis/check_documents.py "${{ github.event.pull_request.base.sha || github.event.before }}"
      - if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all --check
      - if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: steps.scope.outputs.rust == 'true'
        run: cargo test --workspace
      - if: matrix.os == 'ubuntu-latest' && steps.scope.outputs.rust == 'true'
        run: cargo build -p citymap-core --target wasm32-unknown-unknown
      - if: matrix.os == 'ubuntu-latest' && steps.scope.outputs.rust == 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
