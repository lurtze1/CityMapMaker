[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/lurtze1/CityMapMaker"
publish = false

[workspace.dependencies]
citymap-core = { path = "crates/citymap-core" }
citymap-render = { path = "crates/citymap-render" }
clap = "=4.6.7"
geo = { version = "=0.33.1", default-features = false }
insta = "=1.49.0"
proptest = "=1.11.0"
rand_pcg = "=0.10.2"
resvg = { version = "=0.48.1", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde-saphyr = "=2.0.0"
serde_json = "=1.0.151"
svg = "=0.18.0"
thiserror = "=2.0.21"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
float_cmp = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
