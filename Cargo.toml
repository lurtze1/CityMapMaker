[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/lurtze1/CityMapMaker"
publish = false

[workspace.dependencies]
citymap-core = { path = "crates/citymap-core" }
citymap-render = { path = "crates/citymap-render" }
citymap-specification = { path = "crates/citymap-specification" }
clap = "=4.6.7"
geo = { version = "=0.33.1", default-features = false }
insta = "=1.49.0"
proptest = "=1.11.0"
rand_pcg = "=0.10.2"
resvg = { version = "=0.48.1", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde-saphyr = "=2.0.0"
serde_json = "=1.0.151"
svg = "=0.18.0"
thiserror = "=2.0.21"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
missing_assert_message = "warn"
todo = "warn"
unimplemented = "warn"
float_cmp = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
