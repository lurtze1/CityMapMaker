# cargo-deny configuration (ADR-027). CI runs `cargo deny check` on the Linux job.
#
# Allowed dependency licences:
#   MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause, BSD-3-Clause, ISC,
#   Zlib, Unicode-3.0, CC0-1.0, MIT-0 (ADR-070).
# Not allowed: GPL, LGPL, AGPL and MPL in any version (copyleft; CLAUDE.md, Licensing).
# A licence missing from the list fails the check; adding one needs a DECISIONS.md entry.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
include-dev = true
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
