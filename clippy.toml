disallowed-methods = [
  { path = "f64::sin", reason = "use libm::sin: std trig differs across platforms" },
  { path = "f64::cos", reason = "use libm::cos: std trig differs across platforms" },
  { path = "f64::tan", reason = "use libm::tan: std trig differs across platforms" },
  { path = "f64::atan2", reason = "use libm::atan2: std trig differs across platforms" },
  { path = "f64::exp", reason = "use libm::exp: std exp differs across platforms" },
  { path = "f64::ln", reason = "use libm::log: std ln differs across platforms" },
  { path = "f64::powf", reason = "use libm::pow: std powf differs across platforms" },
  { path = "f64::hypot", reason = "use libm::hypot: std hypot differs across platforms" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "use BTreeMap: one sorted collection type, so no iteration order can leak into output (ADR-031)" },
  { path = "std::collections::HashSet", reason = "use BTreeSet: one sorted collection type, so no iteration order can leak into output (ADR-031)" },
]
allow-renamed-params-for = ["..", "core::fmt::Display"]
