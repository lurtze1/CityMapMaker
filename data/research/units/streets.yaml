# Historical units added by the streets topic, each with its factor to metres and the source
# of that factor (ADR-025). A unit with two factors in the reports has two ids.
units:
- identifier: foot-international
  name: international foot
  dimension: length
  factor: 0.3048
  source: citymapmaker-verification-footprints-2026
  note: used for English, US and travellers' feet where the report converts at 0.3048 m
- identifier: yard-international
  name: international yard
  dimension: length
  factor: 0.9144
  source: citymapmaker-verification-footprints-2026
  note: 3 feet at 0.3048 m; south-asia.md converts 40 yards to 36.6 m
- identifier: roman-foot
  name: Roman foot (pes)
  dimension: length
  factor: 0.296
  source: citymapmaker-verification-streets-walls-2026
  note: the verification report's factor; streets.md gives 8 ft as about 2.37 m, the same
- identifier: cubit-legal-hinz
  name: Arabic legal cubit (dhira' shar'i)
  dimension: length
  factor: 0.498
  source: hinz-nd
  note: islamic.md uses this factor unless a source states otherwise
- identifier: cubit-black-hinz
  name: Arabic black cubit, Hinz
  dimension: length
  factor: 0.5404
  source: hinz-nd
  note: differs from the 49.5 cm black cubit in cubit-black-hakim
- identifier: cubit-black-hakim
  name: Arabic black cubit (al-dhira' al-sawda'), Baghdad, Hakim
  dimension: length
  factor: 0.495
  source: csbe-2026
  note: 'streets.md: 49.5 cm; other cubits 58-80 cm; differs from cubit-black-hinz (54.04 cm)'
- identifier: zira-ozdural
  name: Ottoman builder's arşın (zira), Özdural
  dimension: length
  factor: 0.75774
  source: ozdural-1998
- identifier: zira-celik
  name: Ottoman zira as rounded by Çelik
  dimension: length
  factor: 0.76
  source: celik-2010
- identifier: zira-yoruten
  name: Ottoman zira as rounded by Yörüten and Hamamcıoğlu
  dimension: length
  factor: 0.75
  source: yoruten-hamamcioglu-2018
- identifier: danda-kautilya
  name: danda of the Arthashastra (96 angula)
  dimension: length
  factor: 1.69
  source: balasubramaniam-2009
  note: 96 x 1.763 cm, KAZ 2.20.18; differs from danda-shamasastry (6 ft)
- identifier: hasta-mauryan
  name: hasta or aratni of 24 angula
  dimension: length
  factor: 0.423
  source: balasubramaniam-2009
  note: 24 x 1.763 cm, KAZ 2.20.10-12; applying it to the Samarangana and later texts is the report's
    assumption (about plus or minus 15 %)
- identifier: danda-shamasastry
  name: danda as glossed by Shamasastry (6 feet)
  dimension: length
  factor: 1.8288
  source: shamasastry-1915
  note: 'traditions.md: a danda of 6 feet; 6 x 0.3048 m'
- identifier: aratni-shamasastry
  name: aratni as glossed by Shamasastry (1.5 feet)
  dimension: length
  factor: 0.4572
  source: shamasastry-1915
  note: 'derived from traditions.md: chariot roads 5 aratni = 7.5 ft; 1.5 x 0.3048 m'
- identifier: rod-manasara-104
  name: Manasara danda of 104 angula
  dimension: length
  factor: 1.83
  source: acharya-1933
  note: 4 dhanur-mushti cubits of 26 angula (II.51-53) at 1.763 cm; with dhanurgraha cubits it is 108
    angula (rod-manasara-108)
- identifier: rod-manasara-108
  name: Manasara danda of 108 angula
  dimension: length
  factor: 1.9
  source: acharya-1933
  note: the upper reading of the Manasara rod; south-asia.md gives 1.83 to 1.90 m
- identifier: jo-heian
  name: jo of the Heian capital (source metres)
  dimension: length
  factor: 3.0
  source: wikipedia-ja-heiankyo-2026
  note: 40 jo is about 120 m; the reports use the sources' own metres for ancient capitals, not the Meiji
    factor
- identifier: jo-meiji
  name: jo (10 shaku of 10/33 m)
  dimension: length
  factor: 3.0303
  source: wikipedia-ja-jo-2026
- identifier: ken-standard
  name: ken of 6 shaku
  dimension: length
  factor: 1.8182
  source: wikipedia-ja-jo-2026
- identifier: ken-kyoma
  name: kyo-ma ken of 6 shaku 5 sun
  dimension: length
  factor: 1.97
  source: cabinet-office-meireki-2026
- identifier: bu-song-yuan
  name: Song-Yuan bu of 5 chi
  dimension: length
  factor: 1.56
  source: wikipedia-zh-zhongguo-duliangheng-2026
  note: Wang Bin's own metres for Dadu imply about 1.5 m per bu for the main streets and 1.57 m for the
    fire lanes
- identifier: vara-castellana
  name: vara castellana (vara de Burgos)
  dimension: length
  factor: 0.835905
  source: hispanopedia-2026
  note: regional varas 0.768 to 0.837 m (Sáinz Guerra 2014)
- identifier: vara-rena
  name: vara as rounded by Rena
  dimension: length
  factor: 0.83
  source: rena-2019
- identifier: pie-castellano
  name: pie castellano (1/3 vara)
  dimension: length
  factor: 0.278635
  source: hispanopedia-2026
- identifier: braca-ipq
  name: Portuguese braça (10 palmos)
  dimension: length
  factor: 2.2
  source: ipq-2026
  note: some authors 1.84 m
- identifier: braccio-florentine
  name: Florentine braccio da panno
  dimension: length
  factor: 0.5836
  source: bartoli-2019
- identifier: foot-bolognese
  name: Bolognese foot
  dimension: length
  factor: 0.38
  source: wikipedia-it-portici-di-bologna-2026
- identifier: voet-amsterdam
  name: Amsterdam foot (voet)
  dimension: length
  factor: 0.283133
  source: wikipedia-dutch-units-2026
