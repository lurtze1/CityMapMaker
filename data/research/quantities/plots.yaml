# Quantities added by the plots topic (ADR-025).
quantities:
- identifier: plot_area
  dimension: area
  description: ground area of one plot; the note says whether it is a house plot, garden or estate
- identifier: plot_aspect
  dimension: ratio
  description: plot depth divided by plot frontage
- identifier: plot_block_fraction
  dimension: ratio
  description: plot area as a fraction or multiple of one block
- identifier: plot_gap_width
  dimension: length
  description: width of a gap between plots or between back-to-back houses (andron, venelle)
- identifier: plot_count
  dimension: count
  description: number of plots laid out in a town or development; the note says which
- identifier: plots_per_block
  dimension: count
  description: number of plots or houses in one block or gated cluster
- identifier: block_length
  dimension: length
  description: long side of one block, or the side of a square block; the note says which
- identifier: block_width
  dimension: length
  description: short side of one block, measured across the plots
- identifier: block_courtyard_side
  dimension: length
  description: side of an open space left in the middle of a block
- identifier: lane_spacing
  dimension: length
  description: distance between parallel lanes, closes or alleys along a street
- identifier: building_coverage
  dimension: ratio
  description: share of an area covered by buildings; the note names the area (plot, block or district)
- identifier: storeys
  dimension: count
  description: number of storeys of an ordinary building, ground floor included
- identifier: building_height
  dimension: length
  description: height of an ordinary building or a legal height cap; the note says which
- identifier: house_length
  dimension: length
  description: long side, or depth from the street, of one ordinary house; the note says which
- identifier: house_width
  dimension: length
  description: short side, or street frontage, of one ordinary house; the note says which
- identifier: house_footprint_area
  dimension: area
  description: ground area of one ordinary house or workshop
